<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="WCS Suggest: typing bao in a search box suggests 宝马X5, 宝马3系, 宝骏510 and 保时捷">
  <style>
    .h { font: 600 120px Fraunces, Georgia, serif; fill: #102a42; }
    .sub { font: 400 36px Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #48647f; }
    .k { font: 500 22px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.12em; fill: #7a5c10; }
    .m { font: 400 22px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #617d98; }
    .typed { font: 400 40px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #102a42; }
    .sug { font: 400 36px "PingFang SC", "Noto Sans SC", Inter, sans-serif; fill: #48647f; }
    .hit { font-weight: 600; fill: #102a42; }
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.8" fill="#102a42" opacity="0.14"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#fffaeb"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <text x="110" y="100" class="k">INDUSTRY · 58.COM · 2019–2020</text>
  <text x="104" y="226" class="h">WCS Suggest</text>
  <text x="110" y="288" class="sub">Real-time query auto-completion</text>

  <!-- search box -->
  <rect x="110" y="380" width="760" height="96" rx="16" fill="#ffffff" stroke="#102a42" stroke-width="3"/>
  <circle cx="168" cy="426" r="18" fill="none" stroke="#102a42" stroke-width="4"/>
  <line x1="181" y1="439" x2="196" y2="454" stroke="#102a42" stroke-width="4" stroke-linecap="round"/>
  <text x="222" y="441" class="typed">bao</text>
  <line x1="300" y1="404" x2="300" y2="452" stroke="#c8961e" stroke-width="4"/>

  <!-- dropdown -->
  <rect x="110" y="490" width="760" height="320" rx="16" fill="#ffffff" stroke="#102a42" stroke-width="2.5"/>
  <rect x="112" y="492" width="756" height="78" rx="14" fill="#fceec5"/>
  <text x="160" y="544" class="sug"><tspan class="hit">宝</tspan>马X5</text>
  <text x="160" y="624" class="sug"><tspan class="hit">宝</tspan>马3系</text>
  <text x="160" y="704" class="sug"><tspan class="hit">宝</tspan>骏510</text>
  <text x="160" y="784" class="sug"><tspan class="hit">保</tspan>时捷</text>
  <text x="840" y="544" class="m" text-anchor="end">bao·ma</text>
  <text x="840" y="624" class="m" text-anchor="end">bao·ma</text>
  <text x="840" y="704" class="m" text-anchor="end">bao·jun</text>
  <text x="840" y="784" class="m" text-anchor="end">bao·shi·jie</text>

  <!-- tiers -->
  <text x="1010" y="372" class="k">SEGMENT TIERS</text>
  <g stroke="#102a42" stroke-width="2.5">
    <rect x="1010" y="392" width="480" height="64" rx="12" fill="#e9b949"/>
    <rect x="1010" y="476" width="480" height="64" rx="12" fill="#fceec5"/>
    <rect x="1010" y="560" width="480" height="64" rx="12" fill="#ffffff"/>
    <rect x="1010" y="644" width="480" height="64" rx="12" fill="#ffffff"/>
    <rect x="1010" y="728" width="480" height="64" rx="12" fill="#ffffff"/>
  </g>
  <g class="m" style="fill:#102a42">
    <text x="1036" y="432">memtable</text>
    <text x="1036" y="516">sealed segments</text>
    <text x="1036" y="600">merged FST</text>
    <text x="1036" y="684">real-time log</text>
    <text x="1036" y="768">static index</text>
  </g>
  <text x="1464" y="432" class="m" text-anchor="end">live</text>
  <path d="M870 650 C 930 650, 950 592, 1004 592" fill="none" stroke="#c8961e" stroke-width="5" stroke-linecap="round"/>
</svg>
