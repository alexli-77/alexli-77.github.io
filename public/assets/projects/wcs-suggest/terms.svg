<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="Term expansion: the suggestion 宝马X5 becomes character, full-pinyin and initials prefixes, each joined with its filter fields and mapped to a top-20 posting list">
<style>
.h1{font:600 24px Fraunces,Georgia,serif;fill:#102a42}
.s{font:400 12px Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#48647f}
.t{font:600 15px Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#102a42}
.k{font:500 11px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.12em;fill:#7a5c10}
.chip{font:400 14px "JetBrains Mono","PingFang SC","Noto Sans SC",ui-monospace,monospace;fill:#102a42}
.ms{font:400 12px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#617d98}
.m{font:400 13px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#102a42}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d6a96"/></marker></defs>
<rect width="1200" height="390" fill="#fffaeb"/>
<text x="40" y="48" class="h1">Term expansion: every way a user might start typing</text>
<text x="40" y="74" class="s">Each suggestion is indexed under all its prefixes, so a query is one exact lookup instead of a scan.</text>
<rect x="40" y="150" width="200" height="130" rx="10" fill="#fceec5" stroke="#102a42" stroke-width="1.2"/>
<text x="60" y="198" style="font:600 32px 'PingFang SC','Noto Sans SC',Inter,sans-serif;fill:#102a42">宝马X5</text>
<text x="60" y="230" class="ms">weight 100</text>
<text x="60" y="252" class="ms">city 1 · type 2</text>
<path d="M240 215 C 280 215, 270 134, 310 134" fill="none" stroke="#3d6a96" stroke-width="1.6"/>
<text x="318" y="110" class="k">CHARACTERS</text>
<rect x="318" y="118" width="35" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="328" y="139" class="chip">宝</text>
<rect x="361" y="118" width="50" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="371" y="139" class="chip">宝马</text>
<rect x="419" y="118" width="59" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="429" y="139" class="chip">宝马x</text>
<rect x="486" y="118" width="67" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="496" y="139" class="chip">宝马x5</text>
<path d="M240 215 C 280 215, 270 214, 310 214" fill="none" stroke="#3d6a96" stroke-width="1.6"/>
<text x="318" y="190" class="k">FULL PINYIN</text>
<rect x="318" y="198" width="29" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="328" y="219" class="chip">b</text>
<rect x="355" y="198" width="37" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="365" y="219" class="chip">ba</text>
<rect x="400" y="198" width="46" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="410" y="219" class="chip">bao</text>
<rect x="454" y="198" width="54" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="464" y="219" class="chip">baom</text>
<rect x="516" y="198" width="63" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="526" y="219" class="chip">baoma</text>
<rect x="587" y="198" width="72" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="597" y="219" class="chip">baomax</text>
<rect x="667" y="198" width="80" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="677" y="219" class="chip">baomax5</text>
<path d="M240 215 C 280 215, 270 294, 310 294" fill="none" stroke="#3d6a96" stroke-width="1.6"/>
<text x="318" y="270" class="k">INITIALS</text>
<rect x="318" y="278" width="29" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="328" y="299" class="chip">b</text>
<rect x="355" y="278" width="37" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="365" y="299" class="chip">bm</text>
<rect x="400" y="278" width="46" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="410" y="299" class="chip">bmx</text>
<rect x="454" y="278" width="54" height="32" rx="6" fill="#fff" stroke="#102a42" stroke-width="1.1"/>
<text x="464" y="299" class="chip">bmx5</text>
<text x="318" y="356" class="s">Polyphonic characters expand to every reading. Infix terms are optional, for small sets such as city names.</text>
<line x1="860" y1="215" x2="898" y2="215" stroke="#3d6a96" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="900" y="110" width="260" height="210" rx="10" fill="#fff" stroke="#102a42" stroke-width="1.2"/>
<text x="918" y="136" class="t">Key and posting list</text>
<text x="918" y="164" class="s">filters are joined into the key:</text>
<text x="918" y="186" class="m">bao_1_2</text>
<text x="918" y="214" class="s">each key maps to at most 20</text>
<text x="918" y="232" class="s">suggestions, pre-sorted by weight:</text>
<text x="918" y="262" class="s">1 match at the start first</text>
<text x="918" y="282" class="s">2 then the closer length</text>
<text x="918" y="302" class="s">3 then the suggestion's own weight</text>
</svg>