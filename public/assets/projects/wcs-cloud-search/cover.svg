<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="WCS cloud search: 300+ apps routed through stateless route proxies to 4 Kubernetes search clusters">
  <style>
    .h { font: 600 132px Fraunces, Georgia, serif; fill: #102a42; }
    .sub { font: 400 36px Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #48647f; }
    .num { font: 600 92px Fraunces, Georgia, serif; fill: #102a42; }
    .k { font: 500 22px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.12em; fill: #7a5c10; }
    .m { font: 400 22px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #617d98; }
    .lbl { font: 600 30px Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #102a42; }
    .edge { fill: none; stroke: #c8961e; stroke-linecap: round; }
    .feed { fill: none; stroke: #102a42; stroke-width: 2; opacity: 0.35; }
    .clu { fill: #ffffff; stroke: #102a42; stroke-width: 2.5; stroke-dasharray: 10 7; }
    .px { fill: #ffffff; stroke: #102a42; stroke-width: 2.5; }
    .sh { stroke: #102a42; stroke-width: 2; }
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#102a42" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#fffaeb"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- headline -->
  <text x="110" y="100" class="k">INDUSTRY · 58.COM · 2018–2023</text>
  <text x="104" y="232" class="h">WCS</text>
  <text x="110" y="292" class="sub">Cloud Search Platform</text>

  <text x="1490" y="190" class="num" text-anchor="end">200k+</text>
  <text x="1490" y="236" class="m" text-anchor="end">peak QPS · 300+ businesses</text>

  <!-- 300+ apps -->
  <g fill="#ffffff" stroke="#102a42" stroke-width="2.5">
    <circle cx="130" cy="470" r="12"/><circle cx="180" cy="470" r="12"/><circle cx="230" cy="470" r="12"/>
    <circle cx="130" cy="520" r="12"/><circle cx="180" cy="520" r="12" fill="#e9b949"/><circle cx="230" cy="520" r="12"/>
    <circle cx="130" cy="570" r="12"/><circle cx="180" cy="570" r="12"/><circle cx="230" cy="570" r="12" fill="#e9b949"/>
    <circle cx="130" cy="620" r="12" fill="#e9b949"/><circle cx="180" cy="620" r="12"/><circle cx="230" cy="620" r="12"/>
  </g>
  <text x="110" y="690" class="m">300+ apps</text>

  <path d="M242 470 C 330 470, 340 545, 428 552" class="feed"/>
  <path d="M242 520 C 330 520, 340 556, 428 558" class="feed"/>
  <path d="M242 570 C 330 570, 340 562, 428 562" class="feed"/>
  <path d="M242 620 C 330 620, 340 572, 428 568" class="feed"/>

  <!-- route proxy, stacked replicas -->
  <rect x="452" y="464" width="260" height="200" rx="16" fill="#fceec5" stroke="#102a42" stroke-width="2.5" opacity="0.4"/>
  <rect x="441" y="453" width="260" height="200" rx="16" fill="#fceec5" stroke="#102a42" stroke-width="2.5" opacity="0.7"/>
  <rect x="430" y="442" width="260" height="200" rx="16" fill="#fceec5" stroke="#102a42" stroke-width="2.5"/>
  <text x="560" y="538" class="lbl" text-anchor="middle">route proxy</text>
  <text x="560" y="578" class="m" text-anchor="middle">× N replicas</text>

  <!-- weighted edges to the 4 clusters -->
  <path d="M712 520 C 800 520, 790 400, 878 400" class="edge" stroke-width="9"/>
  <path d="M712 545 C 800 545, 800 520, 878 520" class="edge" stroke-width="3"/>
  <path d="M712 575 C 800 575, 800 640, 878 640" class="edge" stroke-width="6"/>
  <path d="M712 600 C 800 600, 790 760, 878 760" class="edge" stroke-width="4"/>

  <!-- 4 clusters: sink proxy + shards -->
  <g>
    <rect x="880" y="360" width="620" height="80" rx="14" class="clu"/>
    <rect x="904" y="378" width="96" height="44" rx="8" class="px"/>
    <line x1="1000" y1="400" x2="1040" y2="400" class="sh"/>
    <g class="sh"><rect x="1048" y="382" width="36" height="36" rx="5" fill="#e9b949"/><rect x="1100" y="382" width="36" height="36" rx="5" fill="#fff"/><rect x="1152" y="382" width="36" height="36" rx="5" fill="#e9b949"/><rect x="1204" y="382" width="36" height="36" rx="5" fill="#fff"/><rect x="1256" y="382" width="36" height="36" rx="5" fill="#fff"/><rect x="1308" y="382" width="36" height="36" rx="5" fill="#e9b949"/></g>
    <text x="1476" y="409" class="m" text-anchor="end">01</text>
  </g>
  <g>
    <rect x="880" y="480" width="620" height="80" rx="14" class="clu"/>
    <rect x="904" y="498" width="96" height="44" rx="8" class="px"/>
    <line x1="1000" y1="520" x2="1040" y2="520" class="sh"/>
    <g class="sh"><rect x="1048" y="502" width="36" height="36" rx="5" fill="#fff"/><rect x="1100" y="502" width="36" height="36" rx="5" fill="#e9b949"/><rect x="1152" y="502" width="36" height="36" rx="5" fill="#fff"/><rect x="1204" y="502" width="36" height="36" rx="5" fill="#fff"/></g>
    <text x="1476" y="529" class="m" text-anchor="end">02</text>
  </g>
  <g>
    <rect x="880" y="600" width="620" height="80" rx="14" class="clu"/>
    <rect x="904" y="618" width="96" height="44" rx="8" class="px"/>
    <line x1="1000" y1="640" x2="1040" y2="640" class="sh"/>
    <g class="sh"><rect x="1048" y="622" width="36" height="36" rx="5" fill="#e9b949"/><rect x="1100" y="622" width="36" height="36" rx="5" fill="#fff"/><rect x="1152" y="622" width="36" height="36" rx="5" fill="#fff"/><rect x="1204" y="622" width="36" height="36" rx="5" fill="#e9b949"/><rect x="1256" y="622" width="36" height="36" rx="5" fill="#fff"/></g>
    <text x="1476" y="649" class="m" text-anchor="end">03</text>
  </g>
  <g>
    <rect x="880" y="720" width="620" height="80" rx="14" class="clu"/>
    <rect x="904" y="738" width="96" height="44" rx="8" class="px"/>
    <line x1="1000" y1="760" x2="1040" y2="760" class="sh"/>
    <g class="sh"><rect x="1048" y="742" width="36" height="36" rx="5" fill="#fff"/><rect x="1100" y="742" width="36" height="36" rx="5" fill="#fff"/><rect x="1152" y="742" width="36" height="36" rx="5" fill="#e9b949"/></g>
    <text x="1476" y="769" class="m" text-anchor="end">04</text>
  </g>

  <!-- Kubernetes floor -->
  <rect x="110" y="828" width="1390" height="36" rx="8" fill="#102a42"/>
  <text x="134" y="853" style="font: 500 18px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.14em; fill: #fffaeb;">KUBERNETES · 4 CLUSTERS · 396 SERVERS</text>
</svg>
